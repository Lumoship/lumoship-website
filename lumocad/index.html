    <div class="status-toggle on" id="tDyn" title="Dynamic input — live dimensions at the cursor">DYN</div>
  </div>

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    (async () => {
        try {
            const { data: { session } } = await supabase.auth.getSession();
            
            const userBadge = document.getElementById('userBadge');
            const loginBadge = document.getElementById('loginBadge');
            
            if (session && session.user) {
                const user = session.user;
                const meta = user.user_metadata || {};
                const displayName = meta.full_name || meta.name || user.email.split('@')[0];
                const firstName = displayName.split(' ')[0];
                
                const avatarEl = document.getElementById('userBadgeAvatar');
                if (meta.avatar_url || meta.picture) {
                    avatarEl.innerHTML = `<img src="${meta.avatar_url || meta.picture}" alt="">`;
                } else {
                    avatarEl.textContent = (firstName[0] || 'U').toUpperCase();
                }
                
                document.getElementById('userBadgeName').textContent = firstName;
                userBadge.style.display = 'inline-flex';
                loginBadge.style.display = 'none';
            } else {
                userBadge.style.display = 'none';
                loginBadge.style.display = 'inline-flex';
            }
        } catch (err) {
