    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0e17;
            --bg-tertiary: #161c2a;
            --bg-card: #0d1220;
            --bg-elevated: #131927;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-glow: rgba(59, 130, 246, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --text-dim: #475569;
            --border: #1e2536;
            --font-display: 'JetBrains Mono', monospace;
            --font-body: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        
        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        .nav {
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
        
        .nav-logo-mark {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, #3b82f6, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 700;
            color: white;
            font-size: 1.1rem;
        }
        
        .nav-logo-text { font-weight: 600; font-size: 1.1rem; color: var(--text-primary); letter-spacing: 0.02em; }
        
        .main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 2rem 1rem;
        }
        
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
        }
        
        .auth-eyebrow {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            text-align: center;
        }
        
        .auth-title {
            font-size: 1.75rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        
        .auth-subtitle {
            color: var(--text-secondary);
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        
        .form-group { margin-bottom: 1.25rem; }
        
        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 200ms;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-tertiary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        .form-input::placeholder { color: var(--text-dim); }
        
        .btn-primary {
            width: 100%;
            padding: 0.875rem 1.25rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 200ms;
            margin-top: 0.5rem;
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .link { color: var(--accent); text-decoration: none; }
        .link:hover { color: var(--accent-hover); text-decoration: underline; }
        
        .auth-footer {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .message {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        
        .message.show { display: block; }
        
        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        
        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }
        
        @media (max-width: 480px) {
            .auth-card { padding: 2rem 1.5rem; }
            .nav-inner { padding: 1rem; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-logo">
                <div class="nav-logo-mark">L</div>
                <span class="nav-logo-text">LUMOSHIP</span>
            </a>
        </div>
    </nav>
    
    <main class="main">
        <div class="auth-card">
            <div class="auth-eyebrow">Password Recovery</div>
            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
            
            <div id="message" class="message"></div>
            
            <form id="resetForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
                </div>
                
                <button type="submit" id="submitBtn" class="btn-primary">Send Reset Link</button>
            </form>
            
            <div class="auth-footer">
                Remember your password? <a href="/login.html" class="link">Sign in</a>
            </div>
        </div>
    </main>
    
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        const SUPABASE_URL = 'https://mjatuomzchnssivvmnsc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qYXR1b216Y2huc3NpdnZtbnNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNDU0NDMsImV4cCI6MjA5NTcyMTQ0M30.1UH6iJ-ews6YBZxFTU5_3t7T7RRb8T049M7wDkOu584';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const messageEl = document.getElementById('message');
        const resetForm = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        
        function showMessage(text, type = 'error') {
            messageEl.textContent = text;
            messageEl.className = `message show ${type}`;
        }
        
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: `${window.location.origin}/login.html`
            });
            
            if (error) {
                showMessage(error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            } else {
                showMessage('✓ Check your email for the reset link', 'success');
                resetForm.reset();
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
